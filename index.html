
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SkyCast | Weather Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="app-container">

        <!-- Header -->
        <header class="topbar">
            <a href="#" class="brand">
                <span class="brand-icon">☁</span>
                <span>SkyCast</span>
            </a>

            <div class="header-date" id="currentDate"></div>
        </header>


        <!-- Welcome Section -->
        <section class="welcome-section">
            <div>
                <p class="eyebrow">WEATHER DASHBOARD</p>
                <h1>Weather at a glance.</h1>
                <p class="welcome-text">
                    Stay prepared. Know your weather.
                </p>
            </div>
        </section>


        <!-- Search -->
        <section class="search-section">
            <div class="search-wrapper">
                <span class="search-icon">⌕</span>

                <input
                    type="text"
                    id="cityInput"
                    placeholder="Search city name..."
                    autocomplete="off"
                >

                <button id="searchBtn">Search</button>
            </div>
        </section>


        <!-- Weather Result -->
        <main id="weatherResult">

            <div class="welcome-card">
                <div class="welcome-emoji">🌤️</div>
                <h2>Your weather starts here</h2>
                <p>Search for a city to discover its current weather.</p>
            </div>

        </main>


        <!-- Footer -->
        <footer>
            <p>Designed with ☁ by SkyCast</p>
            <p>Weather data powered by Open-Meteo</p>
        </footer>

    </div>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script src="script.js"></script>

</body>
</html>
